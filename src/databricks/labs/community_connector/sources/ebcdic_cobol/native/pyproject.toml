[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "lakeflow-ebcdic-decoder"
version = "0.1.0"
description = "Native EBCDIC/COBOL decoder for the Lakeflow community connector"
requires-python = ">=3.10"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "lakeflow_ebcdic_decoder"
include = ["THIRD_PARTY_NOTICES.md"]
